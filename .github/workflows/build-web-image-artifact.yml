      - name: Build Docker image tar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}
          build-args: |
            NEXT_PUBLIC_BASE_PATH=${{ inputs.base_path }}
            COMMIT_SHA=${{ github.sha }}
          outputs: type=docker,dest=${{ env.TAR_PATH }}

      - name: Compress image tar
        run: |
          gzip -f "$TAR_PATH"
          sha256sum "$TGZ_PATH" > "$TGZ_PATH.sha256"
          ls -lh "$TGZ_PATH" "$TGZ_PATH.sha256"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.TGZ_PATH }}
            ${{ env.TGZ_PATH }}.sha256
          if-no-files-found: error
          retention-days: 7
